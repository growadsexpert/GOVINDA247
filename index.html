  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Poppins", Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(37, 211, 102, .16), transparent 28%),
        radial-gradient(circle at 85% 90%, rgba(37, 211, 102, .10), transparent 30%),
        linear-gradient(145deg, #050807 0%, #0a1110 50%, #020403 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      text-align: center;
      padding: 38px 25px 30px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 26px;
      background: rgba(10, 18, 16, .88);
      box-shadow: 0 25px 70px rgba(0,0,0,.55);
      backdrop-filter: blur(12px);
    }

    .icon {
      width: 82px;
      height: 82px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #25D366;
      box-shadow: 0 0 35px rgba(37,211,102,.28);
    }

    .icon svg {
      width: 46px;
      height: 46px;
      fill: #fff;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      margin-bottom: 12px;
      border-radius: 999px;
      background: rgba(37,211,102,.12);
      color: #69ed98;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .5px;
    }

    h1 {
      font-size: clamp(25px, 7vw, 34px);
      line-height: 1.2;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .subtitle {
      color: #b7c0bd;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .number-box {
      padding: 16px 14px;
      border-radius: 15px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.08);
      margin-bottom: 18px;
    }

    .label {
      color: #8f9a96;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 5px;
    }

    .number {
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .4px;
    }

    .whatsapp-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 20px;
      border-radius: 14px;
      background: #25D366;
      color: #061008;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 12px 30px rgba(37,211,102,.22);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .whatsapp-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 35px rgba(37,211,102,.30);
    }

    .whatsapp-btn svg {
      width: 23px;
      height: 23px;
      fill: currentColor;
    }

    .note {
      margin-top: 18px;
      color: #7e8985;
      font-size: 11px;
      line-height: 1.6;
    }

    .footer {
      margin-top: 25px;
      color: #59635f;
      font-size: 10px;
    }

    @media (max-width: 380px) {
      body { padding: 14px; }
      .card { padding: 30px 18px 25px; }
      .number { font-size: 18px; }
    }
  </style>
</head>
